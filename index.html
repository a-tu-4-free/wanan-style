<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>萬安體製造所｜Wanan Style Generator</title>
  <meta name="description" content="輸入任何詞彙，即刻生成萬安體。任何主題都能延伸、任何議題都能協調。本站內容皆為戲仿創作。">
  <meta property="og:title" content="萬安體製造所｜Wanan Style Generator">
  <meta property="og:description" content="輸入任何詞彙，我們第一時間就已經都有掌握。（戲仿創作）">
  <meta property="og:type" content="website">
  <meta name="theme-color" content="#f6f5f1">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23c8102e'/%3E%3Ctext x='32' y='45' font-size='38' text-anchor='middle' fill='white' font-family='sans-serif' font-weight='700'%3E萬%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css?v=20261118-8">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="seal" aria-hidden="true">萬</span>
      <div>
        <h1>萬安體製造所</h1>
        <p>Wanan Style Generator</p>
      </div>
    </div>
    <button type="button" id="btn-clear" class="ghost-btn" hidden>清除對話</button>
  </header>

  <main id="chat" class="chat">
    <section id="welcome" class="welcome">
      <span class="seal seal-lg" aria-hidden="true">萬</span>
      <h2>任何詞彙，我們都已經掌握</h2>
      <p>輸入一個詞，系統即刻召集跨局處會議，產生一段完整說明。</p>
      <div id="examples" class="examples"></div>
    </section>
    <div id="messages" class="messages" aria-live="polite"></div>
  </main>

  <footer class="composer">
    <div class="modes" role="tablist" aria-label="生成模式">
      <button type="button" class="mode active" data-mode="speech" role="tab" aria-selected="true">💬 萬安體</button>
      <button type="button" class="mode" data-mode="angry" role="tab" aria-selected="false">💪 強硬模式</button>
      <button type="button" class="mode" data-mode="title" role="tab" aria-selected="false">🪪 專業職稱</button>
    </div>
    <form id="form" class="input-bar" autocomplete="off">
      <button type="button" id="btn-random" class="icon-btn" title="隨機題目" aria-label="隨機題目">🎲</button>
      <input id="input" type="text" maxlength="30" placeholder="輸入詞彙，例如：披薩、路燈、外星人" enterkeyhint="send" aria-label="輸入詞彙">
      <button type="submit" id="btn-send" class="send-btn">即刻生成</button>
    </form>
    <p class="disclaimer">本站內容皆為戲仿創作，不代表任何人實際發言。</p>
  </footer>

  <div id="toast" class="toast" role="status"></div>

  <div id="modal" class="modal" hidden>
    <div class="modal-box" role="dialog" aria-modal="true" aria-label="分享圖片">
      <img id="modal-img" alt="分享圖片預覽">
      <p class="modal-hint">手機可直接長按圖片儲存，或使用下方按鈕</p>
      <div class="modal-actions">
        <button type="button" id="m-share" class="send-btn" hidden>分享</button>
        <button type="button" id="m-copy" class="ghost-btn" hidden>複製圖片</button>
        <button type="button" id="m-download" class="ghost-btn">下載圖片</button>
        <button type="button" id="m-close" class="ghost-btn">關閉</button>
      </div>
    </div>
  </div>

  <script src="js/engine.js?v=20261118-8"></script>
  <script src="js/title-engine.js?v=20261118-8"></script>
  <script src="js/share.js?v=20261118-8"></script>
  <script src="js/app.js?v=20261118-8"></script>
</body>
</html>
